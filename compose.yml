---
services:
  tsdb:
    container_name: tsdb
    image: timescale/timescaledb:latest-pg18
    restart: on-failure
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: password
      # Cluster-level setup belongs to the entrypoint, not goose: a connection
      # is bound to one database for its lifetime, so the migration cannot
      # create a database and then build tables inside it.
      POSTGRES_DB: observations
    volumes:
      - pg:/pgdata
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d observations"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  pg:
